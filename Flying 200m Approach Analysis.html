<!doctype html>
<html lang="en">
<head>
  <script src="auth-gate.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flying 200m Approach Analysis</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .page-shell,
    .page-frame,
    .page-header,
    .page-body,
    .chart-grid {
      min-width: 0;
    }

    .page-frame,
    .page-header,
    .page-body,
    .chart-grid {
      max-width: 100%;
    }

    .workbook-picker {
      position: relative;
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .workbook-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
      border: 0;
    }

    .workbook-button {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 7px 12px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 6px;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .workbook-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .workbook-input:focus-visible + .workbook-button {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .event-select {
      min-width: 150px;
      max-width: min(220px, calc(100vw - 48px));
      min-height: 36px;
      padding: 6px 28px 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 6px;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      font: inherit;
      font-size: 13px;
    }

    .event-select:disabled { opacity: 0.6; }
    .event-select option { color: #111; }

    .status-line {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.82);
      font-size: 14px;
    }

    .status-line[data-tone="error"] { color: #ffd2cc; }
    .status-line[data-tone="success"] { color: #c9efbf; }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
      gap: 16px;
    }

    .chart-panel {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--color-border);
      border-top: 4px solid var(--color-brand-aqua);
      border-radius: 8px;
      background: var(--color-surface);
    }

    .chart-panel[data-series="pre200"] { border-top-color: var(--color-brand-green); }
    .chart-panel[data-series="banking"] { border-top-color: var(--color-brand-orange); }

    .chart-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .chart-heading h2 {
      margin: 0;
      font-size: 18px;
    }

    .correlation {
      color: var(--color-text-secondary);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    .chart-count {
      margin: 0 0 10px;
      color: var(--color-text-muted);
      font-size: 13px;
    }

    .chart-canvas-wrap {
      position: relative;
      height: 320px;
      min-height: 260px;
    }

    .interpretation {
      margin: 14px 0 0;
      color: var(--color-text-secondary);
      font-size: 13px;
      line-height: 1.5;
    }

    .hidden { display: none !important; }

    @media (max-width: 720px) {
      .page-shell { padding: 10px; }
      .page-body { padding: 16px; }
      .page-header { padding: 20px 16px; }
      .chart-grid { grid-template-columns: minmax(0, 1fr); }
      .chart-canvas-wrap { height: 280px; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <div class="page-frame">
      <header class="page-header">
        <div class="page-title-row">
          <div>
            <span class="page-kicker">Track cycling</span>
            <h1 class="page-title">Flying 200m Approach Analysis</h1>
            <p class="page-subtitle">Compare three entry-speed measures with the final 200m time.</p>
            <div class="workbook-picker">
              <input id="workbook-file" class="workbook-input" type="file" accept=".xlsx,.xlsm,.xls" aria-label="Select race results workbook">
              <label class="workbook-button" for="workbook-file">Select workbook</label>
              <select id="event-select" class="event-select" aria-label="Filter by event or location" disabled>
                <option value="">All events</option>
              </select>
            </div>
            <p id="status" class="status-line" role="status" aria-live="polite">Upload the race-result Excel to begin.</p>
          </div>
          <div class="page-actions">
            <a class="button-secondary" href="index.html">Back to tools</a>
          </div>
        </div>
      </header>

      <div class="page-body grid-stack">
        <section id="results-section" class="chart-grid hidden" aria-label="Entry speed correlation charts">
          <article class="chart-panel" data-series="pre200">
            <div class="chart-heading">
              <h2>Approach</h2>
              <strong id="pre200-correlation" class="correlation">r = --</strong>
            </div>
            <p id="pre200-count" class="chart-count">0 valid pairs</p>
            <div class="chart-canvas-wrap"><canvas id="pre200-chart" aria-label="Approach entry speed versus 200m final time scatter plot"></canvas></div>
          </article>
          <article class="chart-panel" data-series="straight">
            <div class="chart-heading">
              <h2>Straight</h2>
              <strong id="straight-correlation" class="correlation">r = --</strong>
            </div>
            <p id="straight-count" class="chart-count">0 valid pairs</p>
            <div class="chart-canvas-wrap"><canvas id="straight-chart" aria-label="Straight entry speed versus 200m final time scatter plot"></canvas></div>
          </article>
          <article class="chart-panel" data-series="banking">
            <div class="chart-heading">
              <h2>Banking</h2>
              <strong id="banking-correlation" class="correlation">r = --</strong>
            </div>
            <p id="banking-count" class="chart-count">0 valid pairs</p>
            <div class="chart-canvas-wrap"><canvas id="banking-chart" aria-label="Banking entry speed versus 200m final time scatter plot"></canvas></div>
          </article>
        </section>
      </div>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById('workbook-file');
    const eventSelect = document.getElementById('event-select');
    const requiredHeaders = {
      pre200: 'Approach',
      straight: 'Straight',
      banking: 'Banking',
      time: '200m',
      location: 'Location',
      date: 'Date'
    };
    const statusEl = document.getElementById('status');
    const resultsSection = document.getElementById('results-section');
    const chartInstances = { pre200: null, straight: null, banking: null };
    let workbook = null;
    let currentRows = [];
    let currentSheetName = '';
    let columnIndexes = {};

    function setStatus(message, tone = '') {
      statusEl.textContent = message;
      statusEl.dataset.tone = tone;
    }

    function loadScript(src, globalName, promiseName) {
      if (window[globalName]) return Promise.resolve(window[globalName]);
      if (window[promiseName]) return window[promiseName];
      window[promiseName] = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = () => {
          if (window[globalName]) {
            resolve(window[globalName]);
          } else {
            delete window[promiseName];
            reject(new Error(`${globalName} did not initialize.`));
          }
        };
        script.onerror = () => {
          delete window[promiseName];
          reject(new Error(`Unable to load ${globalName}. Check your internet connection and try again.`));
        };
        document.head.appendChild(script);
      });
      return window[promiseName];
    }

    function ensureXLSXLoaded() {
      return loadScript(
        'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js',
        'XLSX',
        '__sprintQXlsxPromise'
      );
    }

    function ensureChartLoaded() {
      return loadScript(
        'https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js',
        'Chart',
        '__sprintQChartPromise'
      );
    }

    function cellText(value) {
      if (value === null || value === undefined) return '';
      if (value instanceof Date && !Number.isNaN(value.valueOf())) return value.toLocaleString();
      return String(value).trim();
    }

    function findSprintWorksheet(sheetNames) {
      return sheetNames.find((name) => /^sprint\s*(?:q|qual(?:ifying)?)$/i.test(name.trim())) || null;
    }

    function findRequiredColumnIndexes(headers) {
      const normalizedHeaders = headers.map((header) => cellText(header).toLowerCase());
      return Object.fromEntries(Object.entries(requiredHeaders).map(([key, header]) => [
        key,
        normalizedHeaders.indexOf(header.toLowerCase())
      ]));
    }

    function dateOrderValue(value) {
      if (value instanceof Date) return value.getTime();
      if (typeof value === 'number') return Number.isFinite(value) ? value : Number.NEGATIVE_INFINITY;
      const timestamp = Date.parse(cellText(value));
      return Number.isFinite(timestamp) ? timestamp : Number.NEGATIVE_INFINITY;
    }

    function configureWorksheet() {
      if (!workbook) return;
      currentSheetName = findSprintWorksheet(workbook.SheetNames);
      if (!currentSheetName) throw new Error('This workbook does not contain a Sprint Q or Sprint Qual worksheet.');

      const worksheet = workbook.Sheets[currentSheetName];
      currentRows = window.XLSX.utils.sheet_to_json(worksheet, {
        header: 1,
        raw: true,
        defval: null,
        blankrows: true
      });
      if (currentRows.length === 0) throw new Error(`The "${currentSheetName}" worksheet is empty.`);

      columnIndexes = findRequiredColumnIndexes(currentRows[0] || []);
      const missingHeaders = Object.entries(columnIndexes)
        .filter(([, index]) => index < 0)
        .map(([key]) => requiredHeaders[key]);
      if (missingHeaders.length > 0) {
        throw new Error(`Row 1 is missing required columns: ${missingHeaders.join(', ')}.`);
      }

      const latestEventDates = new Map();
      currentRows.slice(1).forEach((row) => {
        const eventName = cellText(row[columnIndexes.location]);
        if (!eventName) return;
        const eventDate = dateOrderValue(row[columnIndexes.date]);
        if (!latestEventDates.has(eventName) || eventDate > latestEventDates.get(eventName)) {
          latestEventDates.set(eventName, eventDate);
        }
      });
      const eventNames = [...latestEventDates.keys()].sort((left, right) => {
        const dateDifference = latestEventDates.get(right) - latestEventDates.get(left);
        return dateDifference || left.localeCompare(right);
      });
      eventSelect.replaceChildren();
      const allEventsOption = document.createElement('option');
      allEventsOption.value = '';
      allEventsOption.textContent = 'All events';
      eventSelect.appendChild(allEventsOption);
      eventNames.forEach((eventName) => {
        const option = document.createElement('option');
        option.value = eventName;
        option.textContent = eventName;
        eventSelect.appendChild(option);
      });
      eventSelect.disabled = eventNames.length === 0;
      setStatus(`Loaded "${currentSheetName}" using row 1 headers.`, 'success');
      updateCharts();
    }

    function parseNumber(value) {
      if (typeof value === 'number') return Number.isFinite(value) ? value : null;
      let text = cellText(value).trim();
      if (/^[+-]?\d{1,3}(?:,\d{3})+(?:\.\d+)?$/.test(text)) {
        text = text.replace(/,/g, '');
      } else if (/^[+-]?\d+,\d{1,2}$/.test(text)) {
        text = text.replace(',', '.');
      }
      if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?(?:\s*(?:km\/h|kph|m\/s))?$/i.test(text)) return null;
      const number = Number(text.replace(/\s*(?:km\/h|kph|m\/s)$/i, ''));
      return Number.isFinite(number) ? number : null;
    }

    function parseTimeSeconds(value) {
      if (typeof value === 'number') {
        if (!Number.isFinite(value) || value < 0) return null;
        return value > 0 && value < 1 ? value * 86400 : value;
      }
      const text = cellText(value).replace(/\s*(?:seconds?|secs?|s)$/i, '').trim();
      if (!text) return null;
      if (!text.includes(':')) {
        const number = parseNumber(text);
        if (number === null || number < 0) return null;
        return number > 0 && number < 1 ? number * 86400 : number;
      }

      const parts = text.split(':');
      if (parts.length !== 2 && parts.length !== 3) return null;
      if (!parts.every((part) => /^\d+(?:\.\d+)?$/.test(part))) return null;
      const numbers = parts.map(Number);
      if (numbers.slice(1).some((part) => part >= 60)) return null;
      return parts.length === 2
        ? numbers[0] * 60 + numbers[1]
        : numbers[0] * 3600 + numbers[1] * 60 + numbers[2];
    }

    function getPairedValues(speedKind) {
      const speedColumn = columnIndexes[speedKind];
      const timeColumn = columnIndexes.time;
      if (!Number.isInteger(speedColumn) || !Number.isInteger(timeColumn)) return [];

      const pairs = [];
      for (let rowIndex = 1; rowIndex < currentRows.length; rowIndex += 1) {
        const row = currentRows[rowIndex] || [];
        if (eventSelect.value && cellText(row[columnIndexes.location]) !== eventSelect.value) continue;
        const speed = parseNumber(row[speedColumn]);
        const time = parseTimeSeconds(row[timeColumn]);
        if (speed !== null && time !== null) pairs.push({ x: speed, y: time, row: rowIndex + 1 });
      }
      return pairs;
    }

    function pearsonCorrelation(pairs) {
      if (pairs.length < 2) return null;
      const meanX = pairs.reduce((sum, pair) => sum + pair.x, 0) / pairs.length;
      const meanY = pairs.reduce((sum, pair) => sum + pair.y, 0) / pairs.length;
      let covariance = 0;
      let varianceX = 0;
      let varianceY = 0;
      pairs.forEach(({ x, y }) => {
        const deltaX = x - meanX;
        const deltaY = y - meanY;
        covariance += deltaX * deltaY;
        varianceX += deltaX * deltaX;
        varianceY += deltaY * deltaY;
      });
      if (varianceX === 0 || varianceY === 0) return null;
      return covariance / Math.sqrt(varianceX * varianceY);
    }

    async function renderChart(kind, pairs) {
      const chartId = `${kind}-chart`;
      const canvas = document.getElementById(chartId);
      const correlationEl = document.getElementById(`${kind}-correlation`);
      const countEl = document.getElementById(`${kind}-count`);
      const correlation = pearsonCorrelation(pairs);
      correlationEl.textContent = correlation === null ? 'r = n/a' : `r = ${correlation.toFixed(3)}`;
      countEl.textContent = `${pairs.length} valid ${pairs.length === 1 ? 'pair' : 'pairs'}`;

      if (!window.Chart) return;
      if (chartInstances[kind]) chartInstances[kind].destroy();
      const colors = {
        pre200: { point: '#508542', border: '#345b2b' },
        straight: { point: '#007d8e', border: '#005c68' },
        banking: { point: '#c85820', border: '#873a16' }
      }[kind];
      chartInstances[kind] = new window.Chart(canvas, {
        type: 'scatter',
        data: {
          datasets: [{
            data: pairs,
            pointRadius: 5,
            pointHoverRadius: 7,
            pointBackgroundColor: colors.point,
            pointBorderColor: colors.border,
            pointBorderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (context) => `Speed: ${context.parsed.x} | Final time: ${context.parsed.y.toFixed(3)} s`
              }
            }
          },
          scales: {
            x: {
              type: 'linear',
              title: { display: true, text: 'Time in section' },
              ticks: { maxTicksLimit: 7 },
              grid: { color: 'rgba(40, 60, 70, 0.10)' }
            },
            y: {
              title: { display: true, text: 'Final 200m time' },
              ticks: { maxTicksLimit: 7 },
              grid: { color: 'rgba(40, 60, 70, 0.10)' }
            }
          }
        }
      });
    }

    async function updateCharts() {
      if (!workbook || !currentSheetName) return;
      resultsSection.classList.remove('hidden');
      const pre200Pairs = getPairedValues('pre200');
      const straightPairs = getPairedValues('straight');
      const bankingPairs = getPairedValues('banking');
      [
        ['pre200', pre200Pairs],
        ['straight', straightPairs],
        ['banking', bankingPairs]
      ].forEach(([kind, pairs]) => {
        const correlation = pearsonCorrelation(pairs);
        document.getElementById(`${kind}-correlation`).textContent = correlation === null
          ? 'r = n/a'
          : `r = ${correlation.toFixed(3)}`;
        document.getElementById(`${kind}-count`).textContent = `${pairs.length} valid ${pairs.length === 1 ? 'pair' : 'pairs'}`;
      });
      try {
        await ensureChartLoaded();
        await Promise.all([
          renderChart('pre200', pre200Pairs),
          renderChart('straight', straightPairs),
          renderChart('banking', bankingPairs)
        ]);
        setStatus(`Analysis complete for "${currentSheetName}".`, 'success');
      } catch (error) {
        setStatus(`Chart library error: ${error.message}`, 'error');
      }
    }

    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      setStatus('Reading workbook...');
      eventSelect.disabled = true;
      eventSelect.replaceChildren();
      const defaultEventOption = document.createElement('option');
      defaultEventOption.value = '';
      defaultEventOption.textContent = 'All events';
      eventSelect.appendChild(defaultEventOption);
      resultsSection.classList.add('hidden');
      try {
        const XLSX = await ensureXLSXLoaded();
        workbook = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: false });
        if (!workbook.SheetNames || workbook.SheetNames.length === 0) throw new Error('This workbook has no worksheets.');
        configureWorksheet();
      } catch (error) {
        workbook = null;
        currentRows = [];
        currentSheetName = '';
        columnIndexes = {};
        resultsSection.classList.add('hidden');
        setStatus(`Unable to read this workbook: ${error.message}`, 'error');
      }
    });

    eventSelect.addEventListener('change', updateCharts);
  </script>
</body>
</html>
