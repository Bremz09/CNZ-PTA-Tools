<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Factoring Tool</title>
  <style>
    :root {
      --bg: #eef2f5;
      --panel: #ffffff;
      --text: #1a2630;
      --muted: #526574;
      --accent: #0b6a88;
      --accent-2: #1282a2;
      --selected: #d7f0f8;
      --border: #cdd8e1;
      --danger: #b3261e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, #ffffff 0, #f8fbfd 20%, transparent 45%),
        radial-gradient(circle at 90% 25%, #d7ebf5 0, transparent 40%),
        var(--bg);
      min-height: 100vh;
      padding: 24px;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(10, 38, 56, 0.08);
      padding: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.4rem, 2.2vw, 2rem);
      letter-spacing: 0.02em;
    }

    .tool-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .tool-header h1 {
      margin: 0;
    }

    .dataset-control {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .category-toggle {
      min-width: 130px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f2f8fb;
      color: var(--accent);
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .category-toggle[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .category-toggle:hover {
      border-color: var(--accent-2);
      background: var(--selected);
      color: var(--accent);
    }

    .category-toggle[aria-pressed="true"]:hover {
      background: var(--accent-2);
      color: #fff;
    }

    @media (max-width: 520px) {
      .tool-header {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
      }

      .dataset-control {
        margin-left: 0;
      }
    }

    .sub {
      margin: 0;
      color: var(--muted);
    }

    .race-tabs {
      display: grid;
      grid-template-columns: repeat(var(--race-tab-count, 3), minmax(0, 1fr));
      gap: 8px;
      margin-top: 16px;
      border-bottom: 1px solid var(--border);
    }

    .race-tab {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: 8px 8px 0 0;
      background: #f2f7f9;
      color: var(--muted);
      font: inherit;
      font-weight: 600;
      padding: 10px 34px 10px 12px;
      text-align: left;
      cursor: pointer;
    }

    .race-tab[aria-current="true"] {
      background: #fff;
      border-color: var(--accent-2);
      color: var(--accent);
      box-shadow: inset 0 3px 0 var(--accent-2);
    }

    .race-tab-add {
      display: block;
      padding-right: 12px;
      border-style: dashed;
      color: var(--accent);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .race-tab-add:hover {
      background: var(--selected);
      border-color: var(--accent-2);
    }

    .race-tab-label {
      display: block;
      flex: 1 1 0;
      width: 0;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      direction: ltr;
      text-align: left;
      margin-left: 0;
      cursor: text;
      outline: none;
    }

    .race-tab-label:empty::before {
      content: attr(data-placeholder);
      color: var(--muted);
      pointer-events: none;
    }

    .race-tab-label:focus-visible,
    .race-tab-delete:focus-visible,
    .race-tab-add:focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 2px;
    }

    .race-tab-delete {
      position: absolute;
      top: 4px;
      right: 4px;
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      line-height: 1;
      cursor: pointer;
    }

    .race-tab-delete:hover {
      background: #fce8e6;
      color: var(--danger);
    }

    @media (max-width: 520px) {
      .race-tabs { gap: 4px; }
      .race-tab { padding: 9px 32px 9px 8px; font-size: 0.88rem; }
      .race-tab-add { padding-right: 8px; }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .field {
      grid-column: span 12;
      display: grid;
      gap: 6px;
    }

    .field.half {
      grid-column: span 6;
    }

    @media (max-width: 760px) {
      .field.half { grid-column: span 12; }
      body { padding: 12px; }
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
    }

    .hint {
      font-size: 0.84rem;
      color: var(--muted);
      margin-top: -2px;
    }

    .group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .classification-columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .classification-column {
      min-width: 0;
    }

    .classification-heading {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .classification-options {
      display: grid;
      gap: 6px;
      margin-top: 6px;
    }

    .chip {
      width: 100%;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 6px;
      padding: 7px 5px;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1.2;
      transition: background-color 120ms ease, border-color 120ms ease, transform 120ms ease;
    }

    .chip:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .chip.selected {
      background: var(--selected);
      border-color: var(--accent-2);
      font-weight: 700;
    }

    .actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.96rem;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--accent);
      color: #fff;
    }

    .btn.secondary {
      background: #e6edf2;
      border: 1px solid transparent;
      color: var(--text);
    }

    .btn.ghost {
      background: #f2f8fb;
      border: 1px solid var(--border);
      color: var(--accent);
    }

    .btn.ghost:hover:not(:disabled) {
      background: var(--selected);
      border-color: var(--accent-2);
      color: var(--accent);
    }

    .rider-top .btn.secondary:hover:not(:disabled),
    #resetBtn:hover:not(:disabled) {
      background: #ed6d69;
      border-color: #ae1c17;
      color: #fff;
    }

    .riders {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .rider {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      background: #fcfeff;
      display: grid;
      gap: 8px;
    }

    .rider-top {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 1fr auto;
      align-items: end;
    }

    @media (max-width: 600px) {
      .riders { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .rider-top {
        grid-template-columns: 1fr;
      }
    }

    .mini {
      font-size: 0.78rem;
      color: var(--muted);
      margin: 0;
    }

    .result {
      margin-top: 14px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 14px;
      background: #fbfdff;
      display: grid;
      gap: 6px;
    }

    .result-actions {
      justify-content: space-between;
    }

    .result strong {
      font-size: clamp(1.2rem, 2vw, 1.6rem);
      color: #0d566e;
    }

    .error {
      color: var(--danger);
      font-weight: 600;
      min-height: 1.2em;
      margin-top: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.86rem;
      margin-top: 10px;
      overflow: auto;
      display: block;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: right;
      white-space: nowrap;
    }

    td.blocked {
      background: #000;
      color: #000;
      border-color: #000;
    }

    th.active-col,
    td.active-row {
      background: #e8f6fb;
      font-weight: 700;
    }

    td.active-cell {
      background: #d8f1fb;
      border-color: #5aa8c0;
      font-weight: 700;
    }

    th:first-child, td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      background: #f7fbfd;
      z-index: 1;
    }

    .muted {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <header class="tool-header">
        <h1>Para Factoring Time Tool</h1>
        <div class="dataset-control">
          <button id="datasetCBtn" class="category-toggle" type="button" aria-pressed="true">C Category</button>
          <button id="datasetBBtn" class="category-toggle" type="button" aria-pressed="false">B Category</button>
        </div>
      </header>
      <div id="raceTabs" class="race-tabs" role="group" aria-label="Race calculations"></div>
      <div id="race-panel" role="region">
        <div class="grid">
        <div class="field">
          <label>Riders</label>
          <div id="ridersList" class="riders" aria-label="Rider inputs"></div>
          <button id="addRiderBtn" class="btn ghost" type="button">+ New Rider</button>
        </div>
        </div>

        <div id="error" class="error"></div>

        <div id="result" class="result">
        <div id="resultsTable">
          <table><thead><tr><th>Rank</th><th>Rider</th><th>Class</th><th>Raw Time</th><th>Factor</th><th>Factored Time</th></tr></thead><tbody></tbody></table>
        </div>
        <div class="actions result-actions">
          <button id="exportCsvBtn" class="btn ghost" type="button">Export Results as CSV</button>
          <button id="resetBtn" class="btn secondary" type="button">Reset</button>
        </div>
        </div>
      </div>
    </section>

    <section class="card">
      <label for="tableView">Reference Matrix</label>
      <div id="tableView"></div>
    </section>
  </main>

  <script>
    const datasets = {
      c: {
        name: "C Classes",
        classes: [
          "C5 MEN", "C4 MEN", "C3 MEN", "C5 WOMEN", "C2 MEN",
          "C4 WOMEN", "C1 MEN", "C3 WOMEN", "C2 WOMEN", "C1 WOMEN"
        ],
        rating: {
          "C5 MEN": 1.0,
          "C4 MEN": 0.9866,
          "C3 MEN": 0.9489,
          "C5 WOMEN": 0.8995,
          "C2 MEN": 0.8967,
          "C4 WOMEN": 0.8875,
          "C1 MEN": 0.8731,
          "C3 WOMEN": 0.8535,
          "C2 WOMEN": 0.8066,
          "C1 WOMEN": 0.7854
        }
      },
      b: {
        name: "B Classes",
        classes: ["B MEN", "B WOMEN"],
        rating: {
          "B MEN": 1.0,
          "B WOMEN": 0.8995
        }
      }
    };

    const datasetButtons = {
      c: document.getElementById("datasetCBtn"),
      b: document.getElementById("datasetBBtn")
    };
    const addRiderBtn = document.getElementById("addRiderBtn");
    const ridersListEl = document.getElementById("ridersList");
    const resetBtn = document.getElementById("resetBtn");
    const errorEl = document.getElementById("error");
    const exportCsvBtn = document.getElementById("exportCsvBtn");
    const resultsTableEl = document.getElementById("resultsTable");
    const tableViewEl = document.getElementById("tableView");
    const raceTabsEl = document.getElementById("raceTabs");
    const racePanelEl = document.getElementById("race-panel");

    const maxRaceCount = 6;
    const storageKey = "paraFactoringToolStateV1";
    const savedState = loadSavedState();
    const raceStates = savedState?.raceStates ?? Array.from({ length: 2 }, createRaceState);
    if (savedState && raceStates.length === 3 && isUnusedStarterRace(raceStates[2])) {
      raceStates.pop();
    }
    let activeRaceIndex = Math.min(savedState?.activeRaceIndex ?? 0, raceStates.length - 1);
    let state = raceStates[activeRaceIndex];

    function createRaceState() {
      return {
        raceName: "",
        datasetKey: "c",
        riders: [
          { id: 1, name: "", time: "", riderClass: "C5 MEN" },
          { id: 2, name: "", time: "", riderClass: "C5 MEN" }
        ],
        nextRiderId: 3,
        lastResults: [],
        resultBaseClass: ""
      };
    }

    function isUnusedStarterRace(race) {
      return race.raceName.trim() === ""
        && race.datasetKey === "c"
        && race.nextRiderId === 3
        && race.lastResults.length === 0
        && race.resultBaseClass === ""
        && race.riders.length === 2
        && race.riders.every((rider, index) => (
          rider.id === index + 1
          && rider.name === ""
          && rider.time === ""
          && (rider.riderClass === "C5 MEN" || (index === 1 && rider.riderClass === "C4 MEN"))
        ));
    }

    function loadSavedState() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "null");
        if (!Array.isArray(saved?.raceStates) || saved.raceStates.length < 1) return null;

        const restoredRaces = saved.raceStates.slice(0, maxRaceCount).map((savedRace) => {
          const race = createRaceState();
          if (!savedRace || typeof savedRace !== "object") return race;

          race.raceName = typeof savedRace.raceName === "string" ? savedRace.raceName : "";
          race.datasetKey = Object.prototype.hasOwnProperty.call(datasets, savedRace.datasetKey)
            ? savedRace.datasetKey
            : "c";
          const classes = datasets[race.datasetKey].classes;

          if (Array.isArray(savedRace.riders)) {
            const riders = savedRace.riders
              .filter((rider) => rider && typeof rider === "object")
              .map((rider, index) => ({
                id: Number.isInteger(rider.id) && rider.id > 0 ? rider.id : index + 1,
                name: typeof rider.name === "string" && !/^Rider \d+$/.test(rider.name) ? rider.name : "",
                time: typeof rider.time === "string" ? rider.time : "",
                riderClass: classes.includes(rider.riderClass)
                  ? rider.riderClass
                  : classes[Math.min(index, classes.length - 1)]
              }));
            if (riders.length >= 2) race.riders = riders;
          }

          const minimumNextId = race.riders.reduce((nextId, rider) => Math.max(nextId, rider.id + 1), 3);
          race.nextRiderId = Number.isInteger(savedRace.nextRiderId)
            ? Math.max(savedRace.nextRiderId, minimumNextId)
            : minimumNextId;

          if (classes.includes(savedRace.resultBaseClass) && Array.isArray(savedRace.lastResults)) {
            race.lastResults = savedRace.lastResults
              .filter((row) => row && typeof row.name === "string"
                && classes.includes(row.riderClass)
                && Number.isFinite(row.rawSeconds) && row.rawSeconds > 0
                && Number.isFinite(row.factor) && row.factor > 0
                && Number.isFinite(row.factoredSeconds))
              .map((row, index) => ({ ...row, id: Number.isInteger(row.id) ? row.id : index + 1 }));
            race.resultBaseClass = race.lastResults.length ? savedRace.resultBaseClass : "";
          }

          return race;
        });
        const requestedIndex = Number.isInteger(saved.activeRaceIndex) ? saved.activeRaceIndex : 0;
        return {
          raceStates: restoredRaces,
          activeRaceIndex: Math.max(0, Math.min(requestedIndex, restoredRaces.length - 1))
        };
      } catch {
        return null;
      }
    }

    function saveState() {
      try {
        localStorage.setItem(storageKey, JSON.stringify({ raceStates, activeRaceIndex }));
      } catch {
        // Storage may be unavailable in private or restricted browsing modes.
      }
    }

    function renderRaceTabs() {
      raceTabsEl.innerHTML = "";
      const visibleTabCount = raceStates.length + (raceStates.length < maxRaceCount ? 1 : 0);
      raceTabsEl.style.setProperty("--race-tab-count", visibleTabCount);
      raceStates.forEach((race, index) => {
        const tab = document.createElement("div");
        tab.className = "race-tab";
        tab.id = `race-tab-${index}`;
        tab.setAttribute("role", "group");
        tab.setAttribute("aria-label", `Race ${index + 1}`);
        tab.tabIndex = index === activeRaceIndex ? 0 : -1;

        const label = document.createElement("span");
        label.className = "race-tab-label";
        label.contentEditable = "true";
        label.setAttribute("role", "textbox");
        label.setAttribute("aria-label", `Race ${index + 1} name`);
        label.dataset.placeholder = `Race ${index + 1}`;
        label.textContent = race.raceName;
        label.spellcheck = false;
        label.addEventListener("input", () => {
          race.raceName = label.textContent;
          tab.setAttribute("aria-label", race.raceName.trim() || `Race ${index + 1}`);
          const deleteButton = tab.querySelector(".race-tab-delete");
          if (deleteButton) {
            const raceLabel = race.raceName.trim() || `Race ${index + 1}`;
            deleteButton.title = `Delete ${raceLabel}`;
            deleteButton.setAttribute("aria-label", `Delete ${raceLabel}`);
          }
          saveState();
        });
        label.addEventListener("focus", () => activateRace(index));
        label.addEventListener("keydown", (event) => {
          if (event.key === "Enter") event.preventDefault();
        });

        tab.appendChild(label);
        tab.addEventListener("click", (event) => {
          if (!event.target.closest(".race-tab-delete")) activateRace(index);
        });
        tab.addEventListener("keydown", (event) => {
          if (event.target !== tab || (event.key !== "Enter" && event.key !== " ")) return;
          event.preventDefault();
          activateRace(index);
        });

        if (raceStates.length > 1) {
          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "race-tab-delete";
          deleteButton.textContent = "x";
          deleteButton.title = `Delete ${race.raceName.trim() || `Race ${index + 1}`}`;
          deleteButton.setAttribute("aria-label", `Delete ${race.raceName.trim() || `Race ${index + 1}`}`);
          deleteButton.addEventListener("focus", () => activateRace(index));
          deleteButton.addEventListener("click", (event) => {
            event.stopPropagation();
            deleteRace(index);
          });
          tab.appendChild(deleteButton);
        }
        raceTabsEl.appendChild(tab);
      });
      if (raceStates.length < maxRaceCount) {
        const addTab = document.createElement("button");
        addTab.type = "button";
        addTab.className = "race-tab race-tab-add";
        addTab.textContent = "+ New Race";
        addTab.setAttribute("aria-label", "Add new race");
        addTab.title = "Add new race";
        addTab.addEventListener("click", addRace);
        raceTabsEl.appendChild(addTab);
      }
      updateRaceTabSelection();
    }

    function updateRaceTabSelection() {
      raceStates.forEach((_, index) => {
        const tab = document.getElementById(`race-tab-${index}`);
        if (tab) {
          tab.setAttribute("aria-current", String(index === activeRaceIndex));
          tab.tabIndex = index === activeRaceIndex ? 0 : -1;
        }
      });
    }

    function deleteRace(index) {
      if (raceStates.length <= 1) return;
      raceStates.splice(index, 1);
      if (activeRaceIndex === index) {
        activeRaceIndex = Math.min(index, raceStates.length - 1);
      } else if (index < activeRaceIndex) {
        activeRaceIndex -= 1;
      }
      state = raceStates[activeRaceIndex];
      renderRaceTabs();
      saveState();
      renderActiveRace();
    }

    function addRace() {
      if (raceStates.length >= maxRaceCount) return;
      raceStates.push(createRaceState());
      activeRaceIndex = raceStates.length - 1;
      state = raceStates[activeRaceIndex];
      renderRaceTabs();
      saveState();
      renderActiveRace();
    }

    function activateRace(index) {
      if (activeRaceIndex === index) return;
      activeRaceIndex = index;
      state = raceStates[activeRaceIndex];
      saveState();
      renderActiveRace();
    }

    function renderActiveRace() {
      updateDatasetButtons();
      racePanelEl.setAttribute("aria-labelledby", `race-tab-${activeRaceIndex}`);
      clearMessages();
      updateRaceTabSelection();
      renderRiders();
      renderIncompleteResults();
      renderTable();
      if (state.lastResults.length) {
        renderResults(state.lastResults, state.resultBaseClass);
      }
    }

    function updateDatasetButtons() {
      for (const [datasetKey, button] of Object.entries(datasetButtons)) {
        button.setAttribute("aria-pressed", String(state.datasetKey === datasetKey));
      }
    }

    function selectDataset(datasetKey) {
      if (state.datasetKey === datasetKey) return;
      state.datasetKey = datasetKey;
      updateDatasetButtons();
      const classes = datasets[state.datasetKey].classes;
      state.riders = state.riders.map((rider, index) => ({
        ...rider,
        riderClass: classes.includes(rider.riderClass)
          ? rider.riderClass
          : classes[Math.min(index, classes.length - 1)]
      }));
      renderRiders();
      renderTable();
      updateComparison();
    }

    function escapeCsvValue(value) {
      const text = String(value ?? "");
      if (text.includes('"') || text.includes(",") || text.includes("\n")) {
        return `"${text.replace(/"/g, '""')}"`;
      }
      return text;
    }

    function downloadCsv(filename, rows) {
      const csv = rows.map((cols) => cols.map(escapeCsvValue).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function formatSecondsForCsv(seconds) {
      const formatted = formatSeconds(seconds);
      if (formatted === "--") return "";
      const [base, fraction = ""] = formatted.split(".");
      return `${base}.${fraction.padEnd(2, "0").slice(0, 2)}`;
    }

    function asExcelText(value) {
      return `="${value}"`;
    }

    function parseTimeToSeconds(input) {
      const value = input.trim();
      if (!value) return NaN;

      if (!value.includes(":")) {
        const asNumber = Number(value);
        return Number.isFinite(asNumber) ? asNumber : NaN;
      }

      const parts = value.split(":");
      if (parts.length > 3) return NaN;

      let seconds = 0;
      for (let i = 0; i < parts.length; i += 1) {
        const part = Number(parts[i]);
        if (!Number.isFinite(part)) return NaN;
        seconds = (seconds * 60) + part;
      }
      return seconds;
    }

    function getTimePrecision(input) {
      const fraction = String(input ?? "").match(/\.(\d+)/)?.[1];
      return Math.min(fraction?.length ?? 2, 10);
    }

    function formatSeconds(seconds, decimalPlaces = 2) {
      if (!Number.isFinite(seconds) || seconds < 0) return "--";

      const precision = Math.max(0, Math.min(decimalPlaces, 10));
      const scale = 10 ** precision;
      const rounded = Math.round(seconds * scale);
      const whole = Math.floor(rounded / scale);
      const fraction = precision
        ? `.${String(rounded % scale).padStart(precision, "0")}`
        : "";

      const hrs = Math.floor(whole / 3600);
      const mins = Math.floor((whole % 3600) / 60);
      const secs = whole % 60;

      if (hrs > 0) {
        return `${hrs}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}${fraction}`;
      }
      return `${mins}:${String(secs).padStart(2, "0")}${fraction}`;
    }

    function factorFor(datasetKey, sourceClass, targetClass) {
      const data = datasets[datasetKey];
      const source = data.rating[sourceClass];
      const target = data.rating[targetClass];
      return target / source;
    }

    function getMostAbledClass(datasetKey, classList) {
      const rating = datasets[datasetKey].rating;
      let winner = classList[0];
      for (const cls of classList) {
        if (rating[cls] > rating[winner]) {
          winner = cls;
        }
      }
      return winner;
    }

    function makeClassChips(selectedValue, clickHandler) {
      const wrap = document.createElement("div");
      wrap.className = "classification-columns";

      const classes = datasets[state.datasetKey].classes;
      const groups = [
        classes.filter((cls) => cls.endsWith(" MEN")),
        classes.filter((cls) => cls.endsWith(" WOMEN"))
      ];

      for (const groupClasses of groups) {
        const column = document.createElement("div");
        column.className = "classification-column";

        const options = document.createElement("div");
        options.className = "classification-options";
        for (const cls of groupClasses) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `chip${cls === selectedValue ? " selected" : ""}`;
          btn.textContent = cls;
          btn.addEventListener("click", () => clickHandler(cls));
          options.appendChild(btn);
        }
        column.appendChild(options);
        wrap.appendChild(column);
      }

      return wrap;
    }

    function getActiveMatrixSelection() {
      const classes = datasets[state.datasetKey].classes;
      const selectedClasses = state.riders
        .map((r) => r.riderClass)
        .filter((cls) => classes.includes(cls));

      if (selectedClasses.length === 0) {
        return { activeRows: new Set(), activeCols: new Set(), activeCells: new Set() };
      }

      const moreAbled = getMostAbledClass(state.datasetKey, selectedClasses);
      const activeRows = new Set(selectedClasses);
      const activeCols = new Set([moreAbled]);
      const activeCells = new Set(selectedClasses.map((cls) => `${cls}||${moreAbled}`));
      return { activeRows, activeCols, activeCells };
    }

    function renderTable() {
      const data = datasets[state.datasetKey];
      const classes = data.classes;
      const active = getActiveMatrixSelection();

      let html = "<table><thead><tr><th>To \\ From</th>";
      for (const col of classes) {
        const colClass = active.activeCols.has(col) ? ' class="active-col"' : "";
        html += `<th${colClass}>${col}</th>`;
      }
      html += "</tr></thead><tbody>";

      for (const row of classes) {
        const rowClass = active.activeRows.has(row) ? ' class="active-row"' : "";
        html += `<tr><td${rowClass}>${row}</td>`;
        for (const col of classes) {
          const pct = factorFor(state.datasetKey, col, row) * 100;
          if (pct > 100) {
            html += '<td class="blocked" aria-label="Not used">&nbsp;</td>';
          } else {
            const key = `${row}||${col}`;
            const cellClass = active.activeCells.has(key) ? ' class="active-cell"' : "";
            html += `<td${cellClass}>${pct.toFixed(2)}%</td>`;
          }
        }
        html += "</tr>";
      }

      html += "</tbody></table>";
      tableViewEl.innerHTML = html;
    }

    function renderRiders() {
      const classes = datasets[state.datasetKey].classes;

      ridersListEl.innerHTML = "";
      state.riders.forEach((rider, index) => {
        if (!classes.includes(rider.riderClass)) {
          rider.riderClass = classes[0];
        }

        const card = document.createElement("div");
        card.className = "rider";

        const top = document.createElement("div");
        top.className = "rider-top";

        const nameWrap = document.createElement("div");
        const nameLabel = document.createElement("label");
        nameLabel.textContent = "Name";
        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.value = rider.name;
        nameInput.placeholder = `Rider ${index + 1}`;
        nameInput.addEventListener("input", (e) => {
          rider.name = e.target.value;
          updateComparison();
        });
        nameWrap.appendChild(nameLabel);
        nameWrap.appendChild(nameInput);

        const timeWrap = document.createElement("div");
        const timeLabel = document.createElement("label");
        timeLabel.textContent = "Time";
        const timeInput = document.createElement("input");
        timeInput.type = "text";
        timeInput.value = rider.time;
        timeInput.placeholder = "1:08.45 or 68.45";
        timeInput.addEventListener("input", (e) => {
          rider.time = e.target.value;
          updateComparison();
        });
        timeWrap.appendChild(timeLabel);
        timeWrap.appendChild(timeInput);

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "btn secondary";
        removeBtn.textContent = "Remove";
        removeBtn.disabled = state.riders.length <= 2;
        removeBtn.addEventListener("click", () => {
          if (state.riders.length <= 2) return;
          state.riders = state.riders.filter((x) => x.id !== rider.id);
          renderRiders();
          renderTable();
          updateComparison();
        });

        top.appendChild(nameWrap);
        top.appendChild(timeWrap);
        top.appendChild(removeBtn);

        card.appendChild(top);

        const chips = makeClassChips(rider.riderClass, (cls) => {
          rider.riderClass = cls;
          renderRiders();
          renderTable();
          updateComparison();
        });
        card.appendChild(chips);

        ridersListEl.appendChild(card);
      });
    }

    function renderResults(rows, moreAbledClass) {
      state.lastResults = rows;
      state.resultBaseClass = moreAbledClass;

      let html = "<table><thead><tr><th>Rank</th><th>Rider</th><th>Class</th><th>Raw Time</th><th>Factor</th><th>Factored Time</th></tr></thead><tbody>";
      rows.forEach((row, i) => {
        const rider = state.riders.find((item) => item.id === row.id);
        const precision = getTimePrecision(rider?.time);
        html += `<tr><td>${i + 1}</td><td>${escapeHtml(row.name)}</td><td>${escapeHtml(row.riderClass)}</td><td>${formatSeconds(row.rawSeconds, precision)}</td><td>${(row.factor * 100).toFixed(2)}%</td><td>${formatSeconds(row.factoredSeconds, precision)}</td></tr>`;
      });
      html += "</tbody></table>";
      resultsTableEl.innerHTML = html;

      renderTable();
      saveState();
    }

    function renderIncompleteResults() {
      const classes = datasets[state.datasetKey].classes;
      const riderClasses = state.riders
        .map((rider) => rider.riderClass)
        .filter((riderClass) => classes.includes(riderClass));
      const moreAbledClass = riderClasses.length
        ? getMostAbledClass(state.datasetKey, riderClasses)
        : "";
      const previewRows = state.riders.map((rider, index) => {
        const seconds = parseTimeToSeconds(rider.time || "");
        const hasValidTime = Number.isFinite(seconds) && seconds > 0;
        const factor = moreAbledClass && classes.includes(rider.riderClass)
          ? factorFor(state.datasetKey, moreAbledClass, rider.riderClass)
          : NaN;
        return {
          rider,
          index,
          seconds,
          precision: getTimePrecision(rider.time),
          factor,
          factoredSeconds: hasValidTime ? seconds * factor : NaN,
          hasValidTime
        };
      });
      const rankedRows = previewRows
        .filter((row) => row.hasValidTime)
        .sort((a, b) => a.factoredSeconds - b.factoredSeconds);
      const ranks = new Map(rankedRows.map((row, index) => [row.rider.id, index + 1]));
      const orderedRows = [...rankedRows, ...previewRows.filter((row) => !row.hasValidTime)];
      let html = "<table><thead><tr><th>Rank</th><th>Rider</th><th>Class</th><th>Raw Time</th><th>Factor</th><th>Factored Time</th></tr></thead><tbody>";

      orderedRows.forEach(({ rider, index, seconds, precision, factor, factoredSeconds, hasValidTime }) => {
        const rawTime = hasValidTime ? formatSeconds(seconds, precision) : rider.time || "";
        const factorText = Number.isFinite(factor) ? `${(factor * 100).toFixed(2)}%` : "";
        const rank = ranks.get(rider.id) ?? "";
        const factoredTime = hasValidTime ? formatSeconds(factoredSeconds, precision) : "";
        html += `<tr><td>${rank}</td><td>${escapeHtml(rider.name?.trim() || `Rider ${index + 1}`)}</td><td>${escapeHtml(rider.riderClass)}</td><td>${escapeHtml(rawTime)}</td><td>${factorText}</td><td>${factoredTime}</td></tr>`;
      });

      html += "</tbody></table>";
      resultsTableEl.innerHTML = html;
    }

    function escapeHtml(value) {
      const characters = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
      return String(value ?? "").replace(/[&<>"']/g, (character) => characters[character]);
    }

    function clearMessages() {
      errorEl.textContent = "";
    }

    function invalidateResults() {
      state.lastResults = [];
      state.resultBaseClass = "";
      clearMessages();
      renderIncompleteResults();
      saveState();
    }

    function calculate() {
      invalidateResults();

      if (state.riders.length < 2) {
        errorEl.textContent = "Please keep at least two riders to compare.";
        return;
      }

      const parsed = [];
      for (let i = 0; i < state.riders.length; i += 1) {
        const rider = state.riders[i];
        const seconds = parseTimeToSeconds(rider.time || "");
        if (!Number.isFinite(seconds) || seconds <= 0) {
          errorEl.textContent = `Please enter a valid time for Rider ${i + 1}.`;
          return;
        }
        parsed.push({
          id: rider.id,
          name: rider.name?.trim() || `Rider ${i + 1}`,
          riderClass: rider.riderClass,
          rawSeconds: seconds
        });
      }

      const moreAbledClass = getMostAbledClass(
        state.datasetKey,
        parsed.map((r) => r.riderClass)
      );

      const scored = parsed.map((r) => {
        const factor = factorFor(state.datasetKey, moreAbledClass, r.riderClass);
        return {
          ...r,
          factor,
          factoredSeconds: r.rawSeconds * factor
        };
      });

      scored.sort((a, b) => a.factoredSeconds - b.factoredSeconds);

      renderResults(scored, moreAbledClass);
      renderTable();
    }

    function updateComparison() {
      const allTimesValid = state.riders.length >= 2 && state.riders.every((rider) => {
        const seconds = parseTimeToSeconds(rider.time || "");
        return Number.isFinite(seconds) && seconds > 0;
      });

      if (allTimesValid) {
        calculate();
      } else {
        invalidateResults();
      }
    }

    datasetButtons.c.addEventListener("click", () => selectDataset("c"));
    datasetButtons.b.addEventListener("click", () => selectDataset("b"));

    addRiderBtn.addEventListener("click", () => {
      const classes = datasets[state.datasetKey].classes;
      state.riders.push({
        id: state.nextRiderId,
        name: "",
        time: "",
        riderClass: state.riders[state.riders.length - 1].riderClass
      });
      state.nextRiderId += 1;
      renderRiders();
      renderTable();
      updateComparison();
    });

    resetBtn.addEventListener("click", () => {
      const classes = datasets[state.datasetKey].classes;
      state.riders = [
        { id: 1, name: "", time: "", riderClass: classes[0] },
        { id: 2, name: "", time: "", riderClass: classes[0] }
      ];
      state.nextRiderId = 3;
      invalidateResults();
      renderRiders();
      renderTable();
    });

    exportCsvBtn.addEventListener("click", () => {
      if (!state.lastResults.length) {
        errorEl.textContent = "A comparison will appear once every rider has a valid time.";
        return;
      }

      const rows = [
        ["Rank", "Rider", "Class", "Raw Time", "Factor (%)", "Factored Time"]
      ];

      state.lastResults.forEach((row, i) => {
        const rawTimeText = formatSecondsForCsv(row.rawSeconds);
        const factoredTimeText = formatSecondsForCsv(row.factoredSeconds);
        rows.push([
          i + 1,
          row.name,
          row.riderClass,
          asExcelText(rawTimeText),
          (row.factor * 100).toFixed(2),
          asExcelText(factoredTimeText)
        ]);
      });

      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      const raceSlug = state.raceName.trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
      const racePrefix = raceSlug ? `${raceSlug}-` : "";
      downloadCsv(`para-${racePrefix}factored-riders-${y}${m}${d}.csv`, rows);
    });

    renderRaceTabs();
    renderActiveRace();
  </script>
</body>
</html>
