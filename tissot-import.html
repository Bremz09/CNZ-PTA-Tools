  async function importPdfs(fileList) {
    const files = Array.from(fileList || []);
    if (!files.length || state.busy) return;
    if (!window.pdfjsLib) { showStatus('PDF library unavailable. Connect to the internet and reload.', true); return; }
    if (files.some(file => !/\.pdf$/i.test(file.name))) { showStatus('Choose PDF files only.', true); return; }
    setBusy(true);
    let family = null;
    let familyDocument = null;
    const documents = [];
    const startListEntries = [];
    let startListFiles = 0;
    try {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      for (let fileIndex = 0; fileIndex < files.length; fileIndex++) {
        const file = files[fileIndex];
        showStatus(`Reading PDF ${fileIndex + 1} of ${files.length}: ${file.name}`);
        let pdf;
        try {
          pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer(), isEvalSupported: false }).promise;
          const pages = [];
          for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
            const page = await pdf.getPage(pageNumber);
            pages.push(groupLines((await page.getTextContent()).items));
            page.cleanup();
          }
          const result = parseDocument(pages);
          if (result.schema === schemas.startList) {
            startListFiles++;
            startListEntries.push(...result.rows);
            continue;
          }
          const nextFamily = schemaFamily(result.schema);
          if (family && family !== nextFamily) {
            throw new Error(`${file.name} was detected as ${result.schema.name}, but ${familyDocument.fileName} was detected as ${familyDocument.schema.name}. Select PDFs from one event type, or a matching result and analysis pair.`);
          }
          family = nextFamily;
          familyDocument = { fileName: file.name, schema: result.schema };
          const round = roundFromLines(pages.flat());
          for (const row of result.rows) {
            state.baseMetadata.set(row, Object.fromEntries(metadataFields.map(field => [field, row[field] ?? ''])));
            if (result.schema === schemas.keirin && !row.Classified) row.Round = keirinRoundFromLines(pages.flat());
          }
          documents.push({ ...result, rows: result.rows });
        } finally {
          if (pdf) await pdf.destroy();
        }
      }
      if (!documents.length) throw new Error('No result PDFs were selected.');
      const documentSchemas = documents.map(document => document.schema);
      let rows; let issues;
      if (family === 'sprint') {
        const qualifyingRows = documents.filter(document => document.schema === schemas.sprintQualifying).flatMap(document => document.rows);
        const finalDocuments = documents.filter(document => document.finalRanks?.length);
        const roundRows = documents.filter(document => [schemas.sprintSingle, schemas.sprintMatch].includes(document.schema)).flatMap(document => document.rows);
        if (finalDocuments.length && roundRows.length) {
          const finalRankByRider = new Map(finalDocuments.flatMap(document => document.finalRanks).map(item => [
            `${String(item.Name).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim()}|${String(item.Country).trim().toUpperCase()}`,
            item.Rank
          ]));
          for (const row of roundRows) {
            const key = `${String(row.Athlete || row.Name).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim()}|${String(row.Country || row['Team Code']).trim().toUpperCase()}`;
            if (finalRankByRider.has(key)) row.Final_Rank = finalRankByRider.get(key);
          }
        }
        const orderedRoundRows = sortSprintRounds(roundRows);
        state.exportGroups = [
          ...(qualifyingRows.length ? [{ schema: schemas.sprintQualifying, rows: qualifyingRows }] : []),
          ...(orderedRoundRows.length ? [{ schema: schemas.sprintMatch, rows: orderedRoundRows }] : [])
        ];
        rows = state.exportGroups.flatMap(group => group.rows);
        state.sort = null;
        issues = documents.flatMap(document => document.issues);
        activeSchema = state.exportGroups.length > 1 ? sprintBatchSchema : state.exportGroups[0].schema;
      } else if (family === 'team-sprint') {
        state.exportGroups = [];
        activeSchema = schemas.teamSprintCombined;
        ({ rows, issues } = combineTeamSprint(documents));
        state.sort = null;
      } else if (family === 'keirin') {
        state.exportGroups = [];
        activeSchema = schemas.keirin;
        rows = sortKeirinRounds(documents.flatMap(document => document.rows));
        const riderKey = (name, country) => `${String(name).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim()}|${String(country).trim().toUpperCase()}`;
        const keirinFinalRanks = new Map(documents.flatMap(document => document.finalRanks || []).map(item => [riderKey(item.Name, item.Country), item.Rank]));
        for (const row of rows) {
          const rank = keirinFinalRanks.get(riderKey(row.Name, row['Team Code']));
          if (rank !== undefined) row['Final Rank'] = rank;
        }
        issues = documents.flatMap(document => document.issues);
        state.sort = null;
      } else if (family === 'omnium') {
        state.exportGroups = documents.map(document => ({ schema: document.schema, rows: document.rows }));
        activeSchema = state.exportGroups[0].schema;
        rows = state.exportGroups.flatMap(group => group.rows);
        issues = documents.flatMap(document => document.issues);
        state.sort = null;
      } else {
        state.exportGroups = [];
        activeSchema = documentSchemas.includes(schemas.teamPursuitAnalysis) ? schemas.teamPursuitAnalysis
          : documentSchemas.includes(schemas.analysis) ? schemas.analysis
          : documentSchemas.includes(schemas.timeTrialAnalysis) ? schemas.timeTrialAnalysis
          : documentSchemas.includes(schemas.sprintMatch) ? schemas.sprintMatch
          : documents[0].schema;
        const combined = mergeResultAndAnalysis(documents, activeSchema);
        rows = combined.rows; issues = combined.issues;
      }
      if (family === 'time-trial') {
        rows = sortTimeTrialStages(rows);
        state.sort = null;
      }
      if (family === 'individual-pursuit') {
        rows = sortPursuitStages(rows);
        state.sort = null;
      }
      if (family === 'team-pursuit') {
        const qualifying = rows.filter(row => row.Stage === 'Q');
        qualifying.sort((first, second) => (Number(first.Time) > 0 ? Number(first.Time) : Infinity) - (Number(second.Time) > 0 ? Number(second.Time) : Infinity));
        let rank = 0;
        for (const row of qualifying) {
          row.Stage = 'Q'; row.Heat = 'Q';
          if (Number(row.Time) > 0) row.Rank = ++rank;
        }
        const stageOrder = { Q: 0, R1: 1, F: 2 };
        rows.sort((first, second) => {
          const stageDifference = (stageOrder[first.Stage] ?? 99) - (stageOrder[second.Stage] ?? 99);
          if (stageDifference) return stageDifference;
          if (first.Stage === 'R1') {
            const heatDifference = (Number(first.Heat) || Infinity) - (Number(second.Heat) || Infinity);
            if (heatDifference) return heatDifference;
          }
          return (Number(first.Rank) || Infinity) - (Number(second.Rank) || Infinity);
        });
        state.sort = null;
      }
      const startListMatches = startListEntries.length ? applyStartListNames(rows, startListEntries) : 0;
      for (const row of rows) if (!state.baseMetadata.has(row)) state.baseMetadata.set(row, Object.fromEntries(metadataFields.map(field => [field, row[field] ?? ''])));
      fields = activeSchema.fields; state.rows = rows;
      applyMetadata();
      selectWorksheetForSchema(); renderTable();
      const startListStatus = startListFiles
        ? startListEntries.length ? `${startListMatches} rider names updated from start list.` : 'Start list PDF detected, but no entries could be read.'
        : '';
      showStatus(rows.length ? `${files.length} PDF${files.length === 1 ? '' : 's'} combined: ${rows.length} ${activeSchema.team ? 'teams' : 'riders'} read.${startListStatus ? ` ${startListStatus}` : ''}${issues.length ? ` ${issues.length} missing or inconsistent values; check the source.` : ''}` : 'No results found. Scanned PDFs are not supported.', !rows.length || issues.length > 0);
    } catch (error) { showStatus(`Could not read PDF: ${error.message}`, true); }
    finally { setBusy(false); element('pdf-file').value = ''; }
  }

  async function importWorkbook(file) {
    if (!file || state.busy) return;
    if (!window.XLSX) { showStatus('Excel library unavailable. Connect to the internet and reload.', true); return; }
    if (!/\.xlsx$/i.test(file.name)) { showStatus('Choose an .xlsx file. Macro-enabled .xlsm files are not supported.', true); return; }
    setBusy(true);
    try {
      const workbook = XLSX.read(await file.arrayBuffer(), { type: 'array', cellStyles: true, cellDates: true });
      if (!workbook.SheetNames.length) throw new Error('No worksheets found');
      state.workbook = workbook; state.workbookName = file.name;
      selectWorksheetForSchema();
      showStatus(state.selectedSheet ? `Workbook loaded. ${state.selectedSheet} will be selected automatically for this event.` : 'Workbook loaded. Import a supported event PDF to select its worksheet automatically.');
    } catch (error) { showStatus(`Could not read workbook: ${error.message}`, true); }
    finally { setBusy(false); element('excel-file').value = ''; }
  }

  function exportWorkbook() {
    if (!window.XLSX) { showStatus('Excel library unavailable. Connect to the internet and reload.', true); return; }
    try {
      applyMetadata();
      if (state.exportGroups.length) {
        exportSprintGroups();
        return;
      }
      const selected = activeFields(); const rows = state.rows.filter(row => row.selected);
      if (!selected.length || !rows.length) return;
      const workbook = XLSX.utils.book_new();
      const sheet = buildExport(null, selected, rows);
      XLSX.utils.book_append_sheet(workbook, sheet, activeSchema.name.slice(0, 31));
      XLSX.writeFile(workbook, `${activeSchema.name.replace(/ /g, '-')}.xlsx`, { bookType: 'xlsx', compression: true });
      showStatus(`${rows.length} ${activeSchema.team ? 'teams' : 'riders'} downloaded in a new Excel workbook.`);
    } catch (error) { showStatus(`Could not export: ${error.message}`, true); }
  }

  function exportSprintGroups() {
    const workbook = XLSX.utils.book_new();
    let exported = 0;
    const exportedSheets = [];
    const isOmnium = state.exportGroups.length > 0 && [schemas.omScratch, schemas.omElimination, schemas.omEliminationWomen, schemas.tempo, schemas.omniumPoints, schemas.omniumPointsWomen].includes(state.exportGroups[0].schema);
    for (const group of state.exportGroups) {
      let sheetName;
      if (isOmnium) {
        const candidates = group.schema === schemas.omScratch ? ['Scratch', 'OM-Scratch']
          : [schemas.omElimination, schemas.omEliminationWomen].includes(group.schema) ? ['Elimination Race', 'OM-Elimination']
          : group.schema === schemas.tempo ? ['OM-Tempo', group.schema.name]
          : [schemas.omniumPoints, schemas.omniumPointsWomen].includes(group.schema) ? ['Points', 'OM-Points']
          : [group.schema.name];
        sheetName = state.workbook?.SheetNames.find(name => candidates.includes(name)) || candidates.at(-1);
      } else {
        sheetName = group.schema === schemas.sprintQualifying ? 'Sprint Qual' : 'Sprint';
      }
      const rows = group.rows.filter(row => row.selected);
      if (!rows.length) continue;
      const selected = activeFields(group.schema, sheetName);
      if (!selected.length) throw new Error(`No ${sheetName} fields match its workbook headers.`);
      const output = buildExport(null, selected, rows, group.schema);
      XLSX.utils.book_append_sheet(workbook, output, sheetName.slice(0, 31));
      exported += rows.length;
      exportedSheets.push(sheetName);
    }
    if (!exported) throw new Error(isOmnium ? 'No omnium rows are selected for export.' : 'No sprint rows are selected for export.');
    const omniumSchemas = new Set(state.exportGroups.map(group => group.schema));
    const singleOmniumFileNames = new Map([
      [schemas.omScratch, 'Scratch OM.xlsx'], [schemas.tempo, 'Tempo OM.xlsx'],
      [schemas.omElimination, 'Elim OM.xlsx'], [schemas.omEliminationWomen, 'Elim OM.xlsx'],
      [schemas.omniumPoints, 'Points OM.xlsx'], [schemas.omniumPointsWomen, 'Points OM.xlsx']
    ]);
    const fileName = isOmnium
      ? omniumSchemas.size === 1 ? singleOmniumFileNames.get(omniumSchemas.values().next().value) || 'Omnium-Results.xlsx' : 'Omnium-Results.xlsx'
      : 'Sprint-Results.xlsx';
    XLSX.writeFile(workbook, fileName, { bookType: 'xlsx', compression: true });
    showStatus(`${exported} rows downloaded to ${exportedSheets.join(', ')} in a new workbook, ${fileName}.`);
  }

  element('pdf-file').addEventListener('change', event => importPdfs(event.target.files));
  element('excel-file').addEventListener('change', event => importWorkbook(event.target.files[0]));
  element('export').addEventListener('click', exportWorkbook);
  for (const id of ['metadata-location', 'metadata-year', 'metadata-date', 'metadata-event']) {
    element(id).addEventListener('input', () => { saveMetadata(); applyMetadata(); renderTable(); });
  }
  window.TissotCore = core;
  restoreMetadata();
  renderTable();
  if (window.lucide) window.lucide.createIcons();
  if (!window.pdfjsLib || !window.XLSX) showStatus('Connect to the internet and reload to load the PDF and Excel libraries.', true);
})();
  </script>
</body>
</html>
